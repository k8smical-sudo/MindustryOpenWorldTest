name: Java CI

on:
  push:
  pull_request:
  release:
    types:
      - created
  # Llamado desde compat.yml: prueba el mod contra un motor concreto (candidato o release).
  workflow_call:
    inputs:
      engine_tag:
        description: "Tag de MX-Test a probar. Vacío = última release."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  buildJar:
    name: Build and Publish Jar
    runs-on: ubuntu-latest
    env:
      # Repositorio de tu fork del motor (MX-Test). CAMBIA ESTA LÍNEA si el repo se llama distinto.
      MX_REPO: k8smical-sudo/MX-Test
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Clean
        run: |
          chmod +x gradlew
          ./gradlew clean
      # EntityAnno descarga los componentes de Mindustry desde api.github.com SIN autenticar
      # (límite: 60 peticiones/hora por IP, y los runners comparten IP). Aquí lo hacemos
      # con el token del workflow y luego saltamos la tarea :fetchComps.
      - name: Pre-fetch Mindustry components (authenticated)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release view --repo Anuken/Mindustry --json tagName -q .tagName)
          echo "Mindustry release: $TAG"
          mkdir -p build/fetched-raw
          gh api "repos/Anuken/Mindustry/contents/core/src/mindustry/entities/comp?ref=$TAG" \
            --jq '.[] | "\(.name) \(.download_url)"' |
          while read -r name url; do
            curl -fsSL --retry 3 "$url" -o "build/fetched-raw/$name"
          done
          echo "Components: $(ls build/fetched-raw | wc -l)"
      # El mod usa API que SOLO existe en el motor MX-Test (ChunkDarkness, Tiles.chunkLoaded,
      # World.publishChunk, FogControl.putStaticChunk...). Se compila contra su jar de escritorio,
      # no contra el Mindustry oficial.
      - name: Download MX-Test engine jar
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_TAG: ${{ inputs.engine_tag }}
        run: |
          set -euo pipefail
          TAG="$ENGINE_TAG"
          if [ -z "$TAG" ]; then
            # Última release ESTABLE: se ignoran los candidatos (prereleases) del motor.
            TAG=$(gh release list --repo "$MX_REPO" --limit 30 --json tagName,isPrerelease \
              -q '[.[] | select(.isPrerelease | not)][0].tagName')
          fi
          echo "MX-Test release: $TAG"
          mkdir -p libs
          gh release download "$TAG" --repo "$MX_REPO" --pattern '*-Desktop.jar' --dir libs --clobber
          mv libs/*-Desktop.jar libs/MindustryX-Desktop.jar
          ls -la libs
      - name: Inventario de fuentes (automático)
        shell: bash
        run: bash scripts/inventario.sh build/corpus/inventario

      - name: Build mod artifact
        run: ./gradlew dex -x fetchComps --stacktrace
      # ---- FASE 0 del plan: corpus de regresión del terreno base, equivalencia de hilos y línea base de coste ----
      # Solo usa Muestreo (puro): no necesita el juego. Ya salió en verde, así que ahora es una puerta real: un cambio que altere el mundo,
      # o que rompa la equivalencia entre hilos o el perfil de mundo, hace fallar el build. Solo la línea base sigue siendo informativa.
      - name: Corpus - reproducibilidad, etapas, perfil y equivalencia de hilos
        run: |
          mkdir -p build/corpus
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.Corpus comprobar 2>&1 | tee build/corpus/comprobar.txt
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      - name: Corpus - verificar contra lo congelado
        run: |
          mkdir -p build/corpus
          CP="build/classes/java/main:libs/MindustryX-Desktop.jar"
          # Plan v9, P9: la generación 5 sigue verificándose con su corpus congelado (los mundos guardados con ella no pueden cambiar de terreno)
          if [ -f corpus/esperado-gen5.txt ]; then
            java -cp "$CP" mundoinfinito.Corpus verificar corpus/esperado-gen5.txt 2>&1 | tee build/corpus/verificar-gen5.txt
            test "${PIPESTATUS[0]}" -eq 0
          fi
          if [ -f corpus/esperado.txt ]; then
            java -cp "$CP" mundoinfinito.Corpus verificar corpus/esperado.txt 2>&1 | tee build/corpus/verificar.txt
            test "${PIPESTATUS[0]}" -eq 0
          else
            java -cp "$CP" mundoinfinito.Corpus congelar build/corpus/esperado.txt 2>&1 | tee build/corpus/congelar.txt
            echo "::notice::No existe corpus/esperado.txt. Se generó build/corpus/esperado.txt (artefacto corpus): copialo a corpus/esperado.txt en el repo para fijarlo."
          fi
        shell: bash
      # Comprobación previa: si una clase de prueba no está compilada, el fallo debe decir qué falta (el fuente no llegó al repo o no está en src/mundoinfinito).
      - name: Comprobar que las clases de prueba están compiladas
        run: |
          for c in PruebasLuz PruebasWorldgen PruebasApi PruebasNavegacion PruebasSistemas PruebasRadar PruebasViaje PruebasFenomenos PruebasObjetivos PruebasColision PruebasNiebla PruebasGalaxia InventarioApi; do
            if [ ! -f "build/classes/java/main/mundoinfinito/$c.class" ]; then
              echo "::error::Falta build/classes/java/main/mundoinfinito/$c.class. Comprueba que src/mundoinfinito/$c.java está en el repo (y no en otra carpeta)."
              exit 1
            fi
          done
          echo "Clases de prueba compiladas."
        shell: bash
      # ---- LUZ SOLAR (plan v5, P1 a P3): factor base, eclipse, orden de carga y aislamiento de modificadores que fallan. Sin el juego. ----
      - name: Luz solar - pruebas P1 a P3
        run: |
          mkdir -p build/corpus
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.PruebasLuz 2>&1 | tee build/corpus/luz.txt
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      # ---- WORLDGEN (plan v5, P4): la API de fuentes (bioma, multiplicadores, valores fijos, prioridades y aislamiento de fallos). Sin el juego. ----
      - name: Worldgen - pruebas de la API de fuentes (P4)
        run: |
          mkdir -p build/corpus
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.PruebasWorldgen 2>&1 | tee build/corpus/worldgen.txt
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      # ---- NAVEGACIÓN (plan v6, D14): zoom anclado, paneo, límites y encaje del árbol tecnológico y de la vista 2D de planetas. Sin el juego. ----
      - name: Navegacion - pruebas de zoom y paneo (D14)
        run: |
          mkdir -p build/corpus
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.PruebasNavegacion 2>&1 | tee build/corpus/navegacion.txt
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      # ---- SISTEMAS (plan v6, entrega A: F2 a F5). Estado y migración, fichas, órbitas compartidas y capacidad, solitarios y movimiento. Sin el juego. ----
      - name: Sistemas - pruebas de estado, fichas, slots y movimiento (F2 a F5)
        run: |
          mkdir -p build/corpus
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.PruebasSistemas 2>&1 | tee build/corpus/sistemas.txt
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      # ---- RADARES (plan v7, entrega A2): barrido por tiers, orden por sistema y distancia, tiempos de detección. Sin el juego. ----
      - name: Radares - pruebas de alcance, orden y detección
        run: |
          mkdir -p build/corpus
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.PruebasRadar 2>&1 | tee build/corpus/radar.txt
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      # ---- FENÓMENOS CÓSMICOS Y DIFICULTAD (plan v9, P10). Sin el juego. ----
      - name: Fenomenos y dificultad - pruebas del motor y del agujero negro
        run: |
          mkdir -p build/corpus
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.PruebasFenomenos 2>&1 | tee build/corpus/fenomenos.txt
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      # ---- COLISIONES ENTRE CUERPOS (plan v9, P10). Sin el juego. ----
      - name: Colisiones - pruebas de reglas, fases, azar y superviviente
        run: |
          mkdir -p build/corpus
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.PruebasColision 2>&1 | tee build/corpus/colision.txt
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      # ---- GALAXIA, CONTENIDO EN CAMPAÑA, MIGRACIÓN A MUNDOS, RESPIRADEROS POR FICHA (plan v9). Sin el juego. ----
      - name: Galaxia - grupos, contenido en campaña, migración y respiraderos por ficha
        run: |
          mkdir -p build/corpus
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.PruebasGalaxia 2>&1 | tee build/corpus/galaxia.txt
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      # ---- MEMORIA DE NIEBLA (plan v9). Sin el juego. ----
      - name: Niebla - pruebas de política, hooks y aislamiento de fallos
        run: |
          mkdir -p build/corpus
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.PruebasNiebla 2>&1 | tee build/corpus/niebla.txt
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      # ---- OBJETIVOS DE SECTOR (plan v9, P11). Sin el juego. ----
      - name: Objetivos - pruebas de progreso, texto y gamerule
        run: |
          mkdir -p build/corpus
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.PruebasObjetivos 2>&1 | tee build/corpus/objetivos.txt
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      # ---- VIAJES (plan v7, entrega B1): portales por tiers, enlaces, coste de viaje. Sin el juego. ----
      - name: Viajes - pruebas de portales, enlaces y coste
        run: |
          mkdir -p build/corpus
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.PruebasViaje 2>&1 | tee build/corpus/viaje.txt
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      # ---- COMPATIBILIDAD (plan v5, sección 10, C2 y C3): casos de fallo y de éxito con inventarios de prueba. Sin el juego. ----
      - name: API - pruebas de compatibilidad (C2 y C3)
        run: |
          mkdir -p build/api
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.PruebasApi 2>&1 | tee build/api/pruebas.txt
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      # ---- API PÚBLICA (plan v5, sección 10). C1: el inventario sale igual en dos ejecuciones. C2: quitar o cambiar una firma falla salvo que suba
      # la versión mayor. Sin corpus/api-base.txt el paso informa y no falla; el primer artefacto "corpus" trae build/api/inventario.txt para versionarlo. ----
      - name: API - inventario determinista (C1)
        run: |
          mkdir -p build/api
          CP="build/classes/java/main:libs/MindustryX-Desktop.jar"
          java -cp "$CP" mundoinfinito.InventarioApi generar build/api/inventario.txt
          java -cp "$CP" mundoinfinito.InventarioApi generar build/api/inventario-2.txt
          cmp build/api/inventario.txt build/api/inventario-2.txt
        shell: bash
      - name: API - compatibilidad con la línea base (C2)
        run: |
          CP="build/classes/java/main:libs/MindustryX-Desktop.jar"
          java -cp "$CP" mundoinfinito.InventarioApi comparar corpus/api-base.txt build/api/inventario.txt 2>&1 | tee build/api/comparar.txt
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      - name: Corpus - linea base de coste por chunk
        continue-on-error: true
        run: |
          mkdir -p build/corpus
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.Corpus base build/corpus/linea-base.txt
      - name: Corpus - escalado de la generacion con hilos
        continue-on-error: true
        run: |
          mkdir -p build/corpus
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.Corpus escala build/corpus/escalado.txt
      # ---- FASE DE BENCHMARKS del mod: cobertura automática de la API, correctness de cada caso, sobrecoste de desduplicación, terreno, planetas,
      # tiempo, azar, árbol. Un caso incorrecto o una API sin caso hacen fallar el build; el rendimiento solo avisa frente a la línea base.
      - name: Benchmarks - banco de pruebas del mod
        run: |
          mkdir -p build/benchmarks
          java -cp "build/classes/java/main:libs/MindustryX-Desktop.jar" mundoinfinito.Corpus bench build/benchmarks/resultados.txt corpus/benchmarks-base.txt 2>&1 | tee build/benchmarks/bench.txt
      - name: Subir resultados del corpus y benchmarks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus
          path: |
            build/corpus/
            build/benchmarks/
            build/api/
          if-no-files-found: ignore
      - name: Upload built mod artifact as a GitHub Action artifact
        uses: actions/upload-artifact@v7
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          name: ModTemplate (zipped)
          path: build/libs/ModTemplate.jar
          if-no-files-found: error
          compression-level: 0
      - name: Upload built mod artifact into release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'release' && github.event.action == 'created'
        with:
          files: build/libs/ModTemplate.jar
